spring:
  application:
    name: platform-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      app_role_password: ${DB_APP_PASS:mai_app_local}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 501MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY:local-internal-key}
  ghl-webhook-secret: ${GHL_WEBHOOK_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  slack-webhook-url: ${SLACK_WEBHOOK_URL:}
  alert-channel: ${ALERT_CHANNEL:BOTH}
  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:${java.io.tmpdir}/marketing-ai/files}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:marketing-ai-assets}
      public-url: ${R2_PUBLIC_URL:}
  report:
    email-to: ${REPORT_EMAIL_TO:}
    email-from: ${REPORT_EMAIL_FROM:noreply@marketing-ai.local}
    enabled: ${REPORT_ENABLED:true}
  meta:
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
  encryption:
    key: ${ENCRYPTION_KEY:}
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:}
  mlflow:
    tracking-uri: ${MLFLOW_TRACKING_URI:}

