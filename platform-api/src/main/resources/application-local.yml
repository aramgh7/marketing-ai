spring:
  datasource:
    # stringtype=unspecified: allows String parameters to be coerced to JSONB by PostgreSQL
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketingai}?stringtype=unspecified
    # Non-owner application role: RLS policies are enforced (FORCE) for it. Flyway below keeps the owner role.
    username: ${DB_APP_USER:mai_app}
    password: ${DB_APP_PASS:mai_app_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns the schema; Hibernate must not touch it
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketingai}
    user: ${DB_USER:mai}
    password: ${DB_PASS:mai_local}
    placeholders:
      app_role_password: ${DB_APP_PASS:mai_app_local}   # V116: ALTER ROLE mai_app LOGIN PASSWORD

logging:
  level:
    com.marketingai: DEBUG
    org.springframework.security: DEBUG
