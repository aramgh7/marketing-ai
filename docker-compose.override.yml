# Memory limits reduced from 64 GB sizing to fit ~5 GB available RAM on this instance.
# Ports are set via API_BIND / ML_BIND / FE_BIND in .env.prod (see docker-compose.yml).
# Usage: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.override.yml up -d --build

services:
  platform-api:
    deploy:
      resources:
        limits:
          memory: 1536m

  ml-service:
    deploy:
      resources:
        limits:
          memory: 1536m

  frontend:
    deploy:
      resources:
        limits:
          memory: 512m

  postgres:
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=100
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    deploy:
      resources:
        limits:
          memory: 256m

  db-backup:
    deploy:
      resources:
        limits:
          memory: 256m
