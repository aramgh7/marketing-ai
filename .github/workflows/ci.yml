# CI (audit 2026-10-22, X-9). Five independent jobs; each can be re-run alone from the Actions tab.
# Note: the `secrets` job scans the whole history and will stay red until the credentials file from commit
# ce9904a is purged with `git filter-repo` (X-1) — that is the intended signal, not a flaky job.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: platform-api (gradle test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: platform-api-test-reports
          path: platform-api/build/reports/tests/test

  ml:
    name: ml-service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q -m "not slow"

  frontend:
    name: frontend (tsc + next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

  sql:
    name: schema checks (check-sql, verify-rls, verify-migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker pull -q pgvector/pgvector:pg16 && docker pull -q flyway/flyway:10
      # each script starts its own throwaway Postgres (5441 / 5440 / 5439) and removes it
      - run: python scripts/check-sql.py
      - run: bash scripts/verify-rls.sh
      - run: bash scripts/verify-migrations.sh
      - run: python scripts/check-ml-routes.py

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: deploy to lightsail
    needs: [java, ml, frontend, sql]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: [self-hosted, lightsail]
    steps:
      - name: Deploy
        run: |
          set -e
          cd /home/ubuntu/marketing-ai
          git pull origin master
          docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.override.yml up -d --build frontend platform-api ml-service
          docker image prune -f
